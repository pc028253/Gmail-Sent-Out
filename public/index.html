<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail 郵件發送器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ea4335 0%, #4285f4 50%, #34a853 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        label .required {
            color: #ea4335;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, textarea:focus, .editor:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        .editor {
            width: 100%;
            min-height: 150px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
            overflow-y: auto;
            background: white;
        }

        .editor:empty:before {
            content: attr(data-placeholder);
            color: #999;
        }

        .editor img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 10px 0;
            display: block;
        }

        .editor.dragover {
            border-color: #4285f4;
            background: rgba(66, 133, 244, 0.05);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 8px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .toolbar button:hover {
            background: #4285f4;
            color: white;
            border-color: #4285f4;
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .attachments-section {
            margin-top: 10px;
        }

        .attachments-list {
            background: #f9f9f9;
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .attachments-list.empty {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .attachment-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
        }

        .attachment-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .attachment-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .attachment-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .attachment-details {
            flex: 1;
            min-width: 0;
        }

        .attachment-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attachment-size {
            font-size: 12px;
            color: #666;
        }

        .attachment-remove {
            background: #ea4335;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .attachment-remove:hover {
            background: #c5221f;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 133, 244, 0.4);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.success {
            background: #d4edda;
            border: 2px solid #34a853;
            color: #155724;
        }

        .alert.error {
            background: #f8d7da;
            border: 2px solid #ea4335;
            color: #721c24;
        }

        .alert.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .footer a {
            color: #4285f4;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .warning-text {
            font-size: 12px;
            color: #ea4335;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📧</div>
            <h1>Gmail 郵件發送器</h1>
            <p>輕鬆發送電子郵件（支援圖片 + 附件）</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在發送郵件...</p>
        </div>

        <form id="emailForm">
            <div class="form-group">
                <label for="to">
                    收件人 <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="to"
                    name="to"
                    placeholder="recipient@example.com"
                    required
                >
                <div class="help-text">可以輸入多個郵箱地址，用逗號分隔</div>
            </div>

            <div class="form-group">
                <label for="subject">
                    郵件主旨 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="輸入郵件主旨"
                    required
                >
            </div>

            <div class="form-group">
                <label for="editor">
                    郵件內容 <span class="required">*</span>
                </label>
                <div class="toolbar">
                    <button type="button" id="uploadImageBtn" title="上傳圖片到內容">
                        📷 插入圖片
                    </button>
                    <input type="file" id="imageInput" accept="image/*" multiple>
                    <span style="color: #666; font-size: 12px; line-height: 32px;">
                        或直接貼上/拖放圖片到內容區域
                    </span>
                </div>
                <div
                    id="editor"
                    class="editor"
                    contenteditable="true"
                    data-placeholder="輸入郵件內容... 您可以貼上圖片或拖放圖片到這裡"
                ></div>
                <div class="help-text">支援貼上圖片（Ctrl+V）、拖放圖片，或點擊上方按鈕插入圖片</div>
            </div>

            <div class="form-group">
                <label for="attachments">
                    📎 附件（選填）
                </label>
                <div class="toolbar">
                    <button type="button" id="uploadAttachmentBtn" title="上傳附件">
                        📎 添加附件
                    </button>
                    <input type="file" id="attachmentInput" multiple>
                    <span style="color: #666; font-size: 12px; line-height: 32px;">
                        支援所有檔案類型
                    </span>
                </div>
                <div class="attachments-section">
                    <div id="attachmentsList" class="attachments-list empty">
                        尚未添加附件
                    </div>
                </div>
                <div class="help-text">附件總大小不超過 25MB（Gmail 限制）</div>
                <div class="warning-text" id="attachmentWarning" style="display: none;"></div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                發送郵件
            </button>
        </form>

        <div class="footer">
            <p>使用 Gmail SMTP 服務發送郵件</p>
            <p><a href="/api/health" target="_blank">檢查服務狀態</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const alertBox = document.getElementById('alert');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const editor = document.getElementById('editor');

        // 圖片上傳相關
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const imageInput = document.getElementById('imageInput');

        // 附件上傳相關
        const uploadAttachmentBtn = document.getElementById('uploadAttachmentBtn');
        const attachmentInput = document.getElementById('attachmentInput');
        const attachmentsList = document.getElementById('attachmentsList');
        const attachmentWarning = document.getElementById('attachmentWarning');

        // 存儲附件
        let attachments = [];
        const MAX_TOTAL_SIZE = 25 * 1024 * 1024; // 25MB

        // ==================== 圖片功能 ====================

        // 上傳圖片按鈕
        uploadImageBtn.addEventListener('click', () => {
            imageInput.click();
        });

        // 處理圖片檔案選擇
        imageInput.addEventListener('change', (e) => {
            const files = e.target.files;
            handleImageFiles(files);
            imageInput.value = ''; // 清空，允許重複選擇同一檔案
        });

        // 處理貼上事件
        editor.addEventListener('paste', (e) => {
            console.log('貼上事件觸發');

            if (!e.clipboardData || !e.clipboardData.items) {
                console.log('沒有剪貼板數據');
                return;
            }

            const items = e.clipboardData.items;
            console.log('剪貼板項目數量:', items.length);

            let hasImage = false;

            for (let i = 0; i < items.length; i++) {
                console.log('項目類型:', items[i].type);

                if (items[i].type.indexOf('image') !== -1) {
                    console.log('找到圖片！');
                    e.preventDefault();
                    hasImage = true;
                    const file = items[i].getAsFile();
                    if (file) {
                        insertImage(file);
                    } else {
                        console.error('無法獲取圖片檔案');
                    }
                }
            }

            if (!hasImage) {
                console.log('剪貼板中沒有圖片，允許貼上文字');
            }
        });

        // 處理拖放事件
        editor.addEventListener('dragover', (e) => {
            e.preventDefault();
            editor.classList.add('dragover');
        });

        editor.addEventListener('dragleave', () => {
            editor.classList.remove('dragover');
        });

        editor.addEventListener('drop', (e) => {
            e.preventDefault();
            editor.classList.remove('dragover');

            const files = e.dataTransfer.files;
            handleImageFiles(files);
        });

        // 處理多個圖片檔案
        function handleImageFiles(files) {
            for (let i = 0; i < files.length; i++) {
                if (files[i].type.indexOf('image') !== -1) {
                    insertImage(files[i]);
                }
            }
        }

        // 插入圖片到編輯器
        function insertImage(file) {
            if (!file) {
                console.error('沒有提供檔案');
                showAlert('error', '❌ 無法讀取圖片');
                return;
            }

            console.log('開始讀取圖片:', file.name, file.type, file.size);

            const reader = new FileReader();

            reader.onload = (e) => {
                try {
                    console.log('圖片讀取成功');
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.maxWidth = '100%';
                    img.style.height = 'auto';
                    img.style.border = '1px solid #ddd';
                    img.style.borderRadius = '4px';
                    img.style.padding = '5px';
                    img.style.margin = '10px 0';

                    editor.focus();

                    const selection = window.getSelection();
                    if (selection.rangeCount > 0) {
                        const range = selection.getRangeAt(0);
                        range.deleteContents();
                        range.insertNode(img);

                        const br = document.createElement('br');
                        range.collapse(false);
                        range.insertNode(br);
                        range.setStartAfter(br);
                        selection.removeAllRanges();
                        selection.addRange(range);
                    } else {
                        editor.appendChild(img);
                        editor.appendChild(document.createElement('br'));
                    }

                    console.log('圖片插入成功');
                } catch (error) {
                    console.error('插入圖片時出錯:', error);
                    showAlert('error', '❌ 插入圖片失敗');
                }
            };

            reader.onerror = (error) => {
                console.error('讀取圖片失敗:', error);
                showAlert('error', '❌ 讀取圖片失敗');
            };

            reader.readAsDataURL(file);
        }

        // ==================== 附件功能 ====================

        // 上傳附件按鈕
        uploadAttachmentBtn.addEventListener('click', () => {
            attachmentInput.click();
        });

        // 處理附件選擇
        attachmentInput.addEventListener('change', (e) => {
            const files = e.target.files;
            addAttachments(files);
            attachmentInput.value = ''; // 清空
        });

        // 添加附件
        function addAttachments(files) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];

                // 檢查是否已存在
                if (attachments.some(att => att.name === file.name && att.size === file.size)) {
                    showAlert('error', `❌ 附件 "${file.name}" 已存在`);
                    continue;
                }

                // 檢查總大小
                const totalSize = attachments.reduce((sum, att) => sum + att.size, 0) + file.size;
                if (totalSize > MAX_TOTAL_SIZE) {
                    showAlert('error', '❌ 附件總大小超過 25MB 限制');
                    break;
                }

                attachments.push(file);
            }

            updateAttachmentsList();
        }

        // 更新附件列表顯示
        function updateAttachmentsList() {
            if (attachments.length === 0) {
                attachmentsList.className = 'attachments-list empty';
                attachmentsList.innerHTML = '尚未添加附件';
                attachmentWarning.style.display = 'none';
                return;
            }

            attachmentsList.className = 'attachments-list';
            attachmentsList.innerHTML = '';

            let totalSize = 0;

            attachments.forEach((file, index) => {
                totalSize += file.size;

                const item = document.createElement('div');
                item.className = 'attachment-item';

                const icon = getFileIcon(file.name);

                item.innerHTML = `
                    <div class="attachment-info">
                        <span class="attachment-icon">${icon}</span>
                        <div class="attachment-details">
                            <div class="attachment-name" title="${file.name}">${file.name}</div>
                            <div class="attachment-size">${formatFileSize(file.size)}</div>
                        </div>
                    </div>
                    <button type="button" class="attachment-remove" data-index="${index}">
                        🗑️ 移除
                    </button>
                `;

                attachmentsList.appendChild(item);
            });

            // 添加移除按鈕事件
            document.querySelectorAll('.attachment-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    removeAttachment(index);
                });
            });

            // 顯示總大小警告
            const percentage = (totalSize / MAX_TOTAL_SIZE * 100).toFixed(1);
            if (totalSize > MAX_TOTAL_SIZE * 0.8) {
                attachmentWarning.textContent = `⚠️ 附件總大小: ${formatFileSize(totalSize)} (${percentage}% / 100%)`;
                attachmentWarning.style.display = 'block';
            } else {
                attachmentWarning.style.display = 'none';
            }
        }

        // 移除附件
        function removeAttachment(index) {
            attachments.splice(index, 1);
            updateAttachmentsList();
        }

        // 獲取檔案圖示
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                pdf: '📄',
                doc: '📝', docx: '📝',
                xls: '📊', xlsx: '📊',
                ppt: '📊', pptx: '📊',
                zip: '🗜️', rar: '🗜️', '7z': '🗜️',
                jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', bmp: '🖼️',
                mp4: '🎬', avi: '🎬', mov: '🎬',
                mp3: '🎵', wav: '🎵',
                txt: '📃',
                html: '🌐', css: '🎨', js: '⚙️',
            };
            return icons[ext] || '📎';
        }

        // 格式化檔案大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // ==================== 表單提交 ====================

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 檢查編輯器是否有內容
            const editorContent = editor.innerHTML.trim();
            if (!editorContent || editorContent === '<br>') {
                showAlert('error', '❌ 請輸入郵件內容');
                return;
            }

            // 隱藏之前的提示
            alertBox.classList.remove('show');
            loading.classList.add('show');
            submitBtn.disabled = true;

            try {
                // 準備附件數據
                const attachmentData = await Promise.all(
                    attachments.map(file => {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => {
                                resolve({
                                    filename: file.name,
                                    content: reader.result.split(',')[1], // 移除 data:xxx;base64, 前綴
                                    contentType: file.type || 'application/octet-stream'
                                });
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });
                    })
                );

                // 收集表單數據
                const formData = {
                    to: document.getElementById('to').value,
                    subject: document.getElementById('subject').value,
                    html: editorContent,
                    text: editor.innerText || editor.textContent,
                    attachments: attachmentData
                };

                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                loading.classList.remove('show');
                submitBtn.disabled = false;

                if (data.success) {
                    showAlert('success', '✅ ' + data.message);
                    form.reset();
                    editor.innerHTML = '';
                    attachments = [];
                    updateAttachmentsList();
                } else {
                    showAlert('error', '❌ ' + data.error);
                }
            } catch (error) {
                loading.classList.remove('show');
                submitBtn.disabled = false;
                showAlert('error', '❌ 發送失敗: ' + error.message);
            }
        });

        function showAlert(type, message) {
            alertBox.className = 'alert ' + type + ' show';
            alertBox.textContent = message;

            if (type === 'success') {
                setTimeout(() => {
                    alertBox.classList.remove('show');
                }, 5000);
            }
        }

        // 頁面載入時檢查服務狀態
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                console.log('服務狀態:', data);
            } catch (error) {
                console.error('無法連接到服務器:', error);
            }
        });
    </script>
</body>
</html>
