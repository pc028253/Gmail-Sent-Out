<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail 郵件發送器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ea4335 0%, #4285f4 50%, #34a853 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        label .required {
            color: #ea4335;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, textarea:focus, .editor:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        .editor {
            width: 100%;
            min-height: 200px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
            overflow-y: auto;
            background: white;
        }

        .editor:empty:before {
            content: attr(data-placeholder);
            color: #999;
        }

        .editor img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 10px 0;
            display: block;
        }

        .editor.dragover {
            border-color: #4285f4;
            background: rgba(66, 133, 244, 0.05);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .toolbar button {
            padding: 8px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: #4285f4;
            color: white;
            border-color: #4285f4;
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 133, 244, 0.4);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.success {
            background: #d4edda;
            border: 2px solid #34a853;
            color: #155724;
        }

        .alert.error {
            background: #f8d7da;
            border: 2px solid #ea4335;
            color: #721c24;
        }

        .alert.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .footer a {
            color: #4285f4;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📧</div>
            <h1>Gmail 郵件發送器</h1>
            <p>輕鬆發送電子郵件（支援圖片）</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在發送郵件...</p>
        </div>

        <form id="emailForm">
            <div class="form-group">
                <label for="to">
                    收件人 <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="to"
                    name="to"
                    placeholder="recipient@example.com"
                    required
                >
                <div class="help-text">可以輸入多個郵箱地址，用逗號分隔</div>
            </div>

            <div class="form-group">
                <label for="subject">
                    郵件主旨 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="輸入郵件主旨"
                    required
                >
            </div>

            <div class="form-group">
                <label for="editor">
                    郵件內容 <span class="required">*</span>
                </label>
                <div class="toolbar">
                    <button type="button" id="uploadBtn" title="上傳圖片">
                        📷 上傳圖片
                    </button>
                    <input type="file" id="fileInput" accept="image/*" multiple>
                    <span style="color: #666; font-size: 12px; line-height: 32px;">
                        或直接貼上/拖放圖片到內容區域
                    </span>
                </div>
                <div
                    id="editor"
                    class="editor"
                    contenteditable="true"
                    data-placeholder="輸入郵件內容... 您可以貼上圖片或拖放圖片到這裡"
                ></div>
                <div class="help-text">支援貼上圖片（Ctrl+V）、拖放圖片，或點擊上方按鈕上傳圖片</div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                發送郵件
            </button>
        </form>

        <div class="footer">
            <p>使用 Gmail SMTP 服務發送郵件</p>
            <p><a href="/api/health" target="_blank">檢查服務狀態</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const alertBox = document.getElementById('alert');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const editor = document.getElementById('editor');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        // 上傳圖片按鈕
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // 處理檔案選擇
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            handleFiles(files);
        });

        // 處理貼上事件
        editor.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;

            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    e.preventDefault();
                    const file = items[i].getAsFile();
                    insertImage(file);
                }
            }
        });

        // 處理拖放事件
        editor.addEventListener('dragover', (e) => {
            e.preventDefault();
            editor.classList.add('dragover');
        });

        editor.addEventListener('dragleave', () => {
            editor.classList.remove('dragover');
        });

        editor.addEventListener('drop', (e) => {
            e.preventDefault();
            editor.classList.remove('dragover');

            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        // 處理多個檔案
        function handleFiles(files) {
            for (let i = 0; i < files.length; i++) {
                if (files[i].type.indexOf('image') !== -1) {
                    insertImage(files[i]);
                }
            }
        }

        // 插入圖片到編輯器
        function insertImage(file) {
            const reader = new FileReader();

            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.maxWidth = '100%';
                img.style.height = 'auto';

                // 在編輯器中插入圖片
                editor.focus();
                const selection = window.getSelection();
                const range = selection.getRangeAt(0);
                range.deleteContents();
                range.insertNode(img);

                // 在圖片後添加換行
                const br = document.createElement('br');
                range.collapse(false);
                range.insertNode(br);
                range.setStartAfter(br);
                selection.removeAllRanges();
                selection.addRange(range);
            };

            reader.readAsDataURL(file);
        }

        // 表單提交
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 檢查編輯器是否有內容
            const editorContent = editor.innerHTML.trim();
            if (!editorContent || editorContent === '<br>') {
                showAlert('error', '❌ 請輸入郵件內容');
                return;
            }

            // 隱藏之前的提示
            alertBox.classList.remove('show');
            loading.classList.add('show');
            submitBtn.disabled = true;

            // 收集表單數據
            const formData = {
                to: document.getElementById('to').value,
                subject: document.getElementById('subject').value,
                html: editorContent,
                text: editor.innerText || editor.textContent
            };

            try {
                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                loading.classList.remove('show');
                submitBtn.disabled = false;

                if (data.success) {
                    showAlert('success', '✅ ' + data.message);
                    form.reset();
                    editor.innerHTML = '';
                } else {
                    showAlert('error', '❌ ' + data.error);
                }
            } catch (error) {
                loading.classList.remove('show');
                submitBtn.disabled = false;
                showAlert('error', '❌ 發送失敗: ' + error.message);
            }
        });

        function showAlert(type, message) {
            alertBox.className = 'alert ' + type + ' show';
            alertBox.textContent = message;

            // 5秒後自動隱藏成功訊息
            if (type === 'success') {
                setTimeout(() => {
                    alertBox.classList.remove('show');
                }, 5000);
            }
        }

        // 頁面載入時檢查服務狀態
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                console.log('服務狀態:', data);
            } catch (error) {
                console.error('無法連接到服務器:', error);
            }
        });
    </script>
</body>
</html>
